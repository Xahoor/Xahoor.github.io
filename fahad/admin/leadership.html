<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWRI Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


    <style>

/* Leadership Admin */

.founderPreview{

    width:100%;
    height:300px;
    object-fit:cover;
    border:1px solid #ddd;

}


.committee-item{

    background:#fff;

}


.deleteCommittee,
.deleteGovernor{

    border-radius:8px;

}


.table td,
.table th{

    vertical-align:middle;

}

    </style>

</head>
<body>

<!-- Sidebar -->
<div class="admin-wrapper">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <h4>SWRI Admin</h4>

            <button class="btn-close d-lg-none" id="closeSidebar"></button>
        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="dashboard.html">
                    <i class="fas fa-house"></i>
                    Home Page
                </a>
            </li>

            <li>
                <a href="about.html">
                    <i class="fas fa-circle-info"></i>
                    About Us
                </a>
            </li>

            <li>
                <a href="programs.html">
                    <i class="fas fa-book-open"></i>
                    Programs
                </a>
            </li>

            <li>
                <a href="leadership.html">
                    <i class="fas fa-users"></i>
                    Leadership
                </a>
            </li>

            <li>
                <a href="news.html">
                    <i class="fas fa-newspaper"></i>
                    News & Events
                </a>
            </li>
            
            <li>
                <a href="get-involved.html">
                    <i class="fas fa-handshake"></i>
                    Contributors
                </a>
            </li>

            <li>
                <a href="contact.html">
                    <i class="fas fa-envelope"></i>
                    Contact
                </a>
            </li>

            <li>
                <a href="Setting.html">
                    <i class="fas fa-cog"></i>
                    Setting
                </a>
            </li>

            <li>
                <a href="Logout.html">
                    <i class="fas fa-sign-out"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>

    <!-- Main Content -->
           
        <div class="main-content">

        <nav class="navbar bg-white shadow-sm px-3">

            <button class="btn btn-light d-lg-none" id="openSidebar">
                <i class="fas fa-bars"></i>
            </button>

            <h5 class="ms-2 mb-0">
                Leadership Management
            </h5>

        </nav>


        <div class="p-4">

        <div class="container-fluid">


        <!-- Save Button -->

        <div class="d-flex mb-4">

        <button class="btn btn-success ms-auto px-4">

        <i class="fas fa-save me-2"></i>
        Save Leadership

        </button>

        </div>



        <!-- Page Header -->

        <div class="card shadow-sm mb-4">

        <div class="card-header">
        Page Header
        </div>


        <div class="card-body">

        <label class="form-label">
        Title
        </label>

        <input class="form-control mb-3"
        placeholder="Our Leadership">


        <label class="form-label">
        Subtitle
        </label>

        <textarea class="form-control"
        rows="3"
        placeholder="Meet the dedicated individuals behind SWRI"></textarea>


        </div>

        </div>




        <!-- Founder Section -->


        <div class="card shadow-sm mb-4">


        <div class="card-header">
        Founder Section
        </div>


        <div class="card-body">


        <div class="row">


        <div class="col-lg-4">


        <label class="form-label">
        Founder Image
        </label>


        <img src="https://via.placeholder.com/400x400"
        class="img-fluid rounded shadow mb-3 founderPreview">


        <input type="file"
        class="form-control founderImage">


        </div>



        <div class="col-lg-8">


        <label>
        Founder Name
        </label>

        <input class="form-control mb-3"
        placeholder="Muhammad Fahad Nazir">



        <label>
        Designation
        </label>

        <input class="form-control mb-3"
        placeholder="Founder">



        <label>
        Founder Message
        </label>

        <textarea class="form-control mb-3"
        rows="4"></textarea>



        <label>
        Biography & Qualifications
        </label>

        <textarea class="form-control mb-3"
        rows="5"></textarea>



        <label>
        Experience
        </label>

        <textarea class="form-control"
        rows="5"></textarea>


        </div>


        </div>


        </div>


        </div>





        <!-- Executive Committee -->


        <div class="card shadow-sm mb-4">


        <div class="card-header d-flex justify-content-between align-items-center">


        <span>
        Executive Committee
        </span>


        <button class="btn btn-primary btn-sm"
        id="addCommittee">

        <i class="fas fa-plus"></i>
        Add Member

        </button>


        </div>



        <div class="card-body">


        <div id="committeeContainer">



        <div class="committee-item border rounded p-3 mb-3">


        <div class="row">


        <div class="col-md-4">

        <label>
        Position
        </label>

        <input class="form-control"
        placeholder="Chairperson">

        </div>



        <div class="col-md-6">

        <label>
        Description
        </label>

        <input class="form-control"
        placeholder="Leading strategic direction">


        </div>



        <div class="col-md-2 d-flex align-items-end">

        <button class="btn btn-danger deleteCommittee w-100">

        Delete

        </button>

        </div>


        </div>


        </div>


        </div>


        </div>


        </div>






        <!-- Board Of Governors -->


        <div class="card shadow-sm mb-4">


        <div class="card-header d-flex justify-content-between">


        <span>
        Board Of Governors
        </span>


        <button class="btn btn-primary btn-sm"
        id="addGovernor">

        <i class="fas fa-plus"></i>
        Add Member

        </button>


        </div>



        <div class="card-body">


        <table class="table table-bordered">


        <thead>

        <tr>

        <th>
        Name
        </th>

        <th>
        Role
        </th>

        <th>
        Occupation
        </th>

        <th width="120">
        Action
        </th>


        </tr>

        </thead>



        <tbody id="governorTable">


        <tr>


        <td>
        <input class="form-control"
        placeholder="Representative Name">
        </td>


        <td>
        <input class="form-control"
        placeholder="Member">
        </td>


        <td>
        <input class="form-control"
        placeholder="Occupation">
        </td>



        <td>

        <button class="btn btn-danger btn-sm deleteGovernor">

        Delete

        </button>

        </td>


        </tr>


        </tbody>


        </table>


        </div>


        </div>




        </div>

        </div>


        </div>






        <!-- Add Committee Modal -->


        <div class="modal fade" id="committeeModal">


        <div class="modal-dialog">


        <div class="modal-content">


        <div class="modal-header">

        <h5 class="modal-title">
        Add Committee Member
        </h5>


        <button class="btn-close"
        data-bs-dismiss="modal"></button>


        </div>


        <div class="modal-body">


        <label>
        Position
        </label>

        <input id="committeePosition"
        class="form-control mb-3">



        <label>
        Description
        </label>

        <input id="committeeDescription"
        class="form-control">


        </div>


        <div class="modal-footer">


        <button class="btn btn-secondary"
        data-bs-dismiss="modal">

        Cancel

        </button>


        <button class="btn btn-primary"
        id="saveCommittee">

        Save

        </button>


        </div>


        </div>


        </div>


        </div>





<script src="assets/js/main.js"></script>

<script>
  // Founder Image Preview

document.querySelector(".founderImage")
.addEventListener("change",function(e){


let reader=new FileReader();


reader.onload=function(){

document.querySelector(".founderPreview").src=reader.result;

}


reader.readAsDataURL(e.target.files[0]);


});





// Open Committee Modal

document.getElementById("addCommittee")
.onclick=function(){


document.getElementById("committeePosition").value="";
document.getElementById("committeeDescription").value="";


let modal=new bootstrap.Modal(
document.getElementById("committeeModal")
);


modal.show();


};





// Save Committee Member


document.getElementById("saveCommittee")
.onclick=function(){


let position=
document.getElementById("committeePosition").value;


let description=
document.getElementById("committeeDescription").value;



if(position=="" || description==""){

alert("Fill required fields");
return;

}



let html=`


<div class="committee-item border rounded p-3 mb-3">


<div class="row">


<div class="col-md-4">

<input class="form-control"
value="${position}">

</div>


<div class="col-md-6">

<input class="form-control"
value="${description}">

</div>



<div class="col-md-2">

<button class="btn btn-danger deleteCommittee w-100">

Delete

</button>

</div>


</div>


</div>



`;



document
.getElementById("committeeContainer")
.insertAdjacentHTML(
"beforeend",
html
);



bootstrap.Modal
.getInstance(
document.getElementById("committeeModal")
)
.hide();


};







// Delete Committee

document
.addEventListener("click",function(e){


if(e.target.classList.contains("deleteCommittee")){


e.target.closest(".committee-item").remove();


}



});







// Add Governor


document.getElementById("addGovernor")
.onclick=function(){



let row=`


<tr>


<td>
<input class="form-control"
placeholder="Name">
</td>


<td>
<input class="form-control"
placeholder="Role">
</td>


<td>
<input class="form-control"
placeholder="Occupation">
</td>


<td>

<button class="btn btn-danger btn-sm deleteGovernor">

Delete

</button>

</td>


</tr>



`;


document
.getElementById("governorTable")
.insertAdjacentHTML(
"beforeend",
row
);



};






// Delete Governor


document
.addEventListener("click",function(e){


if(e.target.classList.contains("deleteGovernor")){


e.target.closest("tr").remove();


}


});

</script>

</body>
</html>
