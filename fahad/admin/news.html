<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWRI Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


    <style>

/* News Admin */

.newsPreview{

    width:100%;
    height:250px;
    object-fit:cover;
    border:1px solid #ddd;

}


.news-item{

    background:#fff;

}



.galleryPreview{

    width:100%;
    height:200px;
    object-fit:cover;

}



.gallery-item{

    background:#fff;

}


.deleteNews,
.deleteEvent,
.deleteGallery{

    border-radius:8px;

}


.table td,
.table th{

    vertical-align:middle;

}

    </style>

</head>
<body>

<!-- Sidebar -->
<div class="admin-wrapper">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <h4>SWRI Admin</h4>

            <button class="btn-close d-lg-none" id="closeSidebar"></button>
        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="dashboard.html">
                    <i class="fas fa-house"></i>
                    Home Page
                </a>
            </li>

            <li>
                <a href="about.html">
                    <i class="fas fa-circle-info"></i>
                    About Us
                </a>
            </li>

            <li>
                <a href="programs.html">
                    <i class="fas fa-book-open"></i>
                    Programs
                </a>
            </li>

            <li>
                <a href="leadership.html">
                    <i class="fas fa-users"></i>
                    Leadership
                </a>
            </li>

            <li>
                <a href="news.html">
                    <i class="fas fa-newspaper"></i>
                    News & Events
                </a>
            </li>
            
            <li>
                <a href="get-involved.html">
                    <i class="fas fa-handshake"></i>
                    Contributors
                </a>
            </li>

            <li>
                <a href="contact.html">
                    <i class="fas fa-envelope"></i>
                    Contact
                </a>
            </li>

            <li>
                <a href="Setting.html">
                    <i class="fas fa-cog"></i>
                    Setting
                </a>
            </li>

            <li>
                <a href="Logout.html">
                    <i class="fas fa-sign-out"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    
    <!-- Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>


    <!-- Main Content -->

        <div class="main-content">

        <nav class="navbar bg-white shadow-sm px-3">

        <button class="btn btn-light d-lg-none" id="openSidebar">
        <i class="fas fa-bars"></i>
        </button>

        <h5 class="ms-2 mb-0">
        News & Events Management
        </h5>

        </nav>



        <div class="p-4">

        <div class="container-fluid">



        <!-- Save Button -->

        <div class="d-flex mb-4">

        <button class="btn btn-success ms-auto px-4">

        <i class="fas fa-save me-2"></i>
        Save News

        </button>

        </div>





        <!-- Page Header -->


        <div class="card shadow-sm mb-4">


        <div class="card-header">
        Page Header
        </div>


        <div class="card-body">


        <label class="form-label">
        Title
        </label>

        <input class="form-control mb-3"
        placeholder="News & Events">



        <label class="form-label">
        Subtitle
        </label>


        <textarea class="form-control"
        rows="3"
        placeholder="Stay updated with our latest activities..."></textarea>



        </div>


        </div>







        <!-- Latest News -->


        <div class="card shadow-sm mb-4">


        <div class="card-header d-flex justify-content-between align-items-center">


        <span>
        Latest News
        </span>


        <button class="btn btn-primary btn-sm"
        id="addNews">


        <i class="fas fa-plus"></i>
        Add News


        </button>


        </div>




        <div class="card-body">


        <div id="newsContainer">



        <!-- News Item -->

        <div class="news-item border rounded p-3 mb-4">


        <div class="row">


        <div class="col-lg-4">


        <label>
        News Image
        </label>


        <img src="https://via.placeholder.com/400x250"
        class="img-fluid rounded shadow mb-3 newsPreview">


        <input type="file"
        class="form-control newsImage">


        </div>





        <div class="col-lg-8">


        <label>
        Date / Status
        </label>


        <input class="form-control mb-3"
        placeholder="Coming Soon">





        <label>
        News Title
        </label>


        <input class="form-control mb-3"
        placeholder="Launch of New Vocational Training Center">





        <label>
        Description
        </label>


        <textarea class="form-control mb-3"
        rows="4"></textarea>





        <label>
        Button Text
        </label>


        <input class="form-control mb-3"
        placeholder="Read More">





        <button class="btn btn-danger deleteNews">

        Delete News

        </button>


        </div>



        </div>


        </div>



        </div>


        </div>


        </div>









        <!-- Upcoming Events -->


        <div class="card shadow-sm mb-4">


        <div class="card-header d-flex justify-content-between">


        <span>
        Upcoming Events
        </span>


        <button class="btn btn-primary btn-sm"
        id="addEvent">


        <i class="fas fa-plus"></i>
        Add Event

        </button>


        </div>



        <div class="card-body">


        <table class="table table-bordered">


        <thead>

        <tr>

        <th>
        Event Title
        </th>

        <th>
        Date
        </th>

        <th width="120">
        Action
        </th>


        </tr>

        </thead>



        <tbody id="eventTable">


        <tr>

        <td>

        <input class="form-control"
        placeholder="Workshops">

        </td>


        <td>

        <input class="form-control"
        placeholder="TBA">

        </td>


        <td>

        <button class="btn btn-danger btn-sm deleteEvent">

        Delete

        </button>

        </td>


        </tr>


        </tbody>


        </table>


        </div>


        </div>








        <!-- Success Stories -->


        <div class="card shadow-sm mb-4">


        <div class="card-header">

        Success Stories

        </div>



        <div class="card-body">


        <textarea class="form-control"
        rows="5"
        placeholder="Stay tuned for inspiring stories..."></textarea>


        </div>


        </div>







        <!-- Photo Gallery -->


        <div class="card shadow-sm mb-4">


        <div class="card-header d-flex justify-content-between">


        <span>
        Photo Gallery
        </span>


        <button class="btn btn-primary btn-sm"
        id="addGallery">


        <i class="fas fa-plus"></i>
        Add Image

        </button>


        </div>



        <div class="card-body">


        <div class="row g-3"
        id="galleryContainer">



        <div class="col-md-4 gallery-item">


        <div class="border rounded p-2">


        <img src="https://via.placeholder.com/400x250"
        class="img-fluid rounded galleryPreview mb-2">


        <input type="file"
        class="form-control galleryImage mb-2">


        <button class="btn btn-danger btn-sm deleteGallery">

        Delete

        </button>


        </div>


        </div>


        </div>


        </div>


        </div>





        </div>

        </div>

        </div>
            




<script src="assets/js/main.js"></script>

<script>

// =========================
// News Image Preview
// =========================


document.addEventListener("change",function(e){


if(e.target.classList.contains("newsImage")){


let file=e.target.files[0];

let reader=new FileReader();


reader.onload=function(){


e.target
.closest(".news-item")
.querySelector(".newsPreview")
.src=reader.result;


}


reader.readAsDataURL(file);


}

});







// =========================
// Add News
// =========================


document.getElementById("addNews")
.onclick=function(){



let html=`


<div class="news-item border rounded p-3 mb-4">


<div class="row">


<div class="col-lg-4">


<img src="https://via.placeholder.com/400x250"
class="img-fluid rounded shadow mb-3 newsPreview">


<input type="file"
class="form-control newsImage">


</div>



<div class="col-lg-8">


<input class="form-control mb-3"
placeholder="Date / Status">


<input class="form-control mb-3"
placeholder="News Title">


<textarea class="form-control mb-3"
rows="4"
placeholder="Description"></textarea>


<input class="form-control mb-3"
placeholder="Button Text">


<button class="btn btn-danger deleteNews">

Delete News

</button>


</div>


</div>


</div>


`;



document
.getElementById("newsContainer")
.insertAdjacentHTML(
"beforeend",
html
);


};







// Delete News

document.addEventListener("click",function(e){


if(e.target.classList.contains("deleteNews")){


e.target.closest(".news-item").remove();


}


});









// Add Event


document.getElementById("addEvent")
.onclick=function(){


let row=`


<tr>

<td>

<input class="form-control"
placeholder="Event">

</td>


<td>

<input class="form-control"
placeholder="TBA">

</td>


<td>

<button class="btn btn-danger btn-sm deleteEvent">

Delete

</button>

</td>


</tr>


`;


document
.getElementById("eventTable")
.insertAdjacentHTML(
"beforeend",
row
);


};







// Delete Event


document.addEventListener("click",function(e){


if(e.target.classList.contains("deleteEvent")){


e.target.closest("tr").remove();


}


});










// Gallery Image Preview


document.addEventListener("change",function(e){


if(e.target.classList.contains("galleryImage")){


let file=e.target.files[0];

let reader=new FileReader();


reader.onload=function(){


e.target
.closest(".gallery-item")
.querySelector(".galleryPreview")
.src=reader.result;


}


reader.readAsDataURL(file);


}


});







// Add Gallery Image


document.getElementById("addGallery")
.onclick=function(){


let html=`


<div class="col-md-4 gallery-item">


<div class="border rounded p-2">


<img src="https://via.placeholder.com/400x250"
class="img-fluid rounded galleryPreview mb-2">


<input type="file"
class="form-control galleryImage mb-2">


<button class="btn btn-danger btn-sm deleteGallery">

Delete

</button>


</div>


</div>


`;


document
.getElementById("galleryContainer")
.insertAdjacentHTML(
"beforeend",
html
);


};







// Delete Gallery


document.addEventListener("click",function(e){


if(e.target.classList.contains("deleteGallery")){


e.target.closest(".gallery-item").remove();


}


});
</script>

</body>
</html>
