            class="form-control">

            data-bs-dismiss="modal">

            Cancel

            </button>



            <button class="btn btn-primary"
            id="saveProgram">

            Save

            </button>

            </div>


            </div>

<!-- Content -->





<script src="assets/js/main.js"></script>

<script>
    // =========================
// Program Image Preview
// =========================


document.addEventListener("change",function(e){


if(e.target.classList.contains("programImage")){


let file=e.target.files[0];


let reader=new FileReader();



reader.onload=function(){


e.target
.closest(".program-item")
.querySelector(".programPreview")
.src=reader.result;


}



reader.readAsDataURL(file);



}


});





// =========================
// Open Modal
// =========================


document.getElementById("addProgram")
.onclick=function(){


document.querySelectorAll("#programModal input")
.forEach(i=>i.value="");


document.querySelector("#programModal textarea").value="";


let modal=new bootstrap.Modal(
document.getElementById("programModal")
);


modal.show();


};






// =========================
// Save Program
// =========================


document.getElementById("saveProgram")
.onclick=function(){



let title=document.getElementById("programTitle").value;


let desc=document.getElementById("programDescription").value;


let f1=document.getElementById("feature1").value;


let f2=document.getElementById("feature2").value;


let f3=document.getElementById("feature3").value;



if(title=="" || desc==""){

alert("Fill required fields");

return;

}

.getElementById("programContainer")
.insertAdjacentHTML("beforeend",html);



bootstrap.Modal
.getInstance(
document.getElementById("programModal")
)
.hide();



};





// =========================
// Delete Program
// =========================


</script>
